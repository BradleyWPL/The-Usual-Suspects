# File: compose.yaml
# History: Version 0.2, October 17, 2026
# Program: Define the local app and PostgreSQL development services.
# Input: Docker image definitions, local environment settings, ports, and volumes.
# Processing: Start a healthy database before the app generates and loads demo data.
# Output: A local containerized demo stack.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: incidentlens
      POSTGRES_USER: incidentlens_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlens -d incidentlens"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://incidentlens_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}@db:5432/incidentlens
    ports:
      - "127.0.0.1:8000:8000"
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes: &project_data
      - generated-data:/app/data/generated
      - analysis-data:/app/data/analysis
      - review-state:/app/data/state
    restart: unless-stopped
  setup:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://incidentlens_admin:${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}@db:5432/incidentlens
      APP_DATABASE_USER: incidentlens_app
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
    command: ["sh", "-c", "python data/provision_postgres.py && python data/generate.py --profile quick && python pipelines/analyze.py && python data/load_postgres.py"]
    volumes: *project_data
    restart: "no"

volumes:
  postgres-data:
  generated-data:
  analysis-data:
  review-state:
