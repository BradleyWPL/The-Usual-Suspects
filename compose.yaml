services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: incidentlens
      POSTGRES_USER: incidentlens
      POSTGRES_PASSWORD: REMOVED_DEFAULT
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlens -d incidentlens"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://incidentlens:REMOVED_DEFAULT@db:5432/incidentlens
    ports:
      - "8000:8000"
    volumes:
      - review-state:/app/data/state
    restart: unless-stopped

volumes:
  postgres-data:
  review-state:
